schema: spec-driven

context: |
  Tech stack: Python 3 (standard library based, zero external dependencies)
  Architecture: Model bridge service connecting Antigravity to local/custom LLM endpoints
  Testing: python3 -m unittest
  Style: Clean standard Python, PEP 8, pure standard library

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true           # Set to true to enable RED-GREEN-REFACTOR
    test_command: "python3 -m unittest"
  verify:
    test_command: "python3 -m unittest"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  detected_date: "2026-09-25"
  runner:
    command: "python3 -m unittest"
    framework: "unittest"
  layers:
    unit:
      available: true
      tool: "unittest"
    integration:
      available: true
      tool: "unittest"
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality:
    linter:
      available: false
      command: null
    type_checker:
      available: false
      command: null
    formatter:
      available: false
      command: null
