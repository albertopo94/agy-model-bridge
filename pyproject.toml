[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-model-bridge"
version = "0.23.0"
description = "Antigravity Model Bridge - Local AI Gateway for Claude Code, Codex, and OpenAI Clients"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Albert", email = "albertopo94@users.noreply.github.com" }
]
keywords = ["antigravity", "gemini", "claude-code", "codex", "llm-bridge", "ai-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
agy-bridge = "bridge.__main__:main"
agy-model-bridge = "bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B", "S"]
ignore = [
    "S104",  # Binding or validating 0.0.0.0 is an intentional CLI option
    "S105",  # False positives on parameter and variable names like 'token' or 'auth_token'
    "S107",  # False positives on placeholder default argument values
    "S310",  # urllib urlopen for trusted Google Cloud Code and localhost daemon endpoints
    "S311",  # Pseudo-random generator used exclusively for retry backoff jitter
    "S603",  # Subprocess call with explicit argument lists and no shell=True
    "S607",  # Partial executable path (sys.executable, git, security)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
