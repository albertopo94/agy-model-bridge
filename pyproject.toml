[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-model-bridge"
version = "0.6.1"
description = "Antigravity Model Bridge - Local AI Gateway for Claude Code, Codex, and OpenAI Clients"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Albert", email = "albertopo94@users.noreply.github.com" }
]
keywords = ["antigravity", "gemini", "claude-code", "codex", "llm-bridge", "ai-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
agy-bridge = "bridge.__main__:main"
agy-model-bridge = "bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["bridge*"]
